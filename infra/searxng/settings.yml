# Keep local SERP collection on a stable engine for diploma/dev audits.
use_default_settings:
  engines:
    keep_only:
      - presearch

general:
  instance_name: "Diplom Local SearxNG"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "diplom-local-searxng-secret-key"
  limiter: false
  image_proxy: true
  public_instance: false

redis:
  url: redis://redis:6379/0

engines:
  - name: presearch
    engine: presearch
    search_type: search
    categories: [general, web]
    shortcut: ps
    timeout: 8.0
    disabled: false
